name: CI Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify Portfolio Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Next.js Modern Portfolio
        run: |
          cd modern-portfolio
          npm ci
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build React Client App
        run: |
          cd client
          npm ci
          npm run build
        env:
          CI: false
